name: Release & Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (verify, build, test, pack without publishing to npm or creating live release)'
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  verify-and-pack:
    name: verify-and-pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      tarball: ${{ steps.pack.outputs.TARBALL }}
      is_dry_run: ${{ steps.check_dry_run.outputs.DRY_RUN }}
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Workflow values are passed through env, never interpolated into the script text.
      - name: Determine run mode
        id: check_dry_run
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN_INPUT" != "false" ]; then
            echo "DRY_RUN=true" >> "$GITHUB_OUTPUT"
          else
            echo "DRY_RUN=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read .nvmrc
        id: nvm
        run: echo "NODE_VERSION=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"

      # No dependency cache in the release job: a poisoned cache must never reach a published build.
      - name: Setup Node.js ${{ steps.nvm.outputs.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate release metadata & version consistency
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_REF: ${{ github.ref_name }}
          DRY_RUN: ${{ steps.check_dry_run.outputs.DRY_RUN }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if ! printf '%s' "$PKG_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::package.json version '$PKG_VERSION' is not a valid semver version"
            exit 1
          fi
          echo "VERSION=$PKG_VERSION" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" = "push" ]; then
            EXPECTED_TAG="v${PKG_VERSION}"
            if [ "$TAG_REF" != "$EXPECTED_TAG" ]; then
              echo "::error::Tag mismatch: tag is '$TAG_REF' but package.json version is '$PKG_VERSION' (expected '$EXPECTED_TAG')"
              exit 1
            fi
          fi

          # Every real (non-dry-run) release, tag push or manual run, must come from a commit on main.
          if [ "$DRY_RUN" != "true" ]; then
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::Release commit must be reachable from main branch!"
              exit 1
            fi
          fi

          # Verify CHANGELOG has heading for this version
          if ! grep -qF "## [${PKG_VERSION}]" CHANGELOG.md; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning::CHANGELOG.md does not yet have section '## [${PKG_VERSION}]' (acceptable for dry run)"
            else
              echo "::error::CHANGELOG.md missing release section '## [${PKG_VERSION}]'!"
              exit 1
            fi
          fi

      - name: Type check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Build library (ES + UMD + declarations)
        run: npm run build

      - name: Lint package exports and types
        run: npm run lint:package

      - name: Run automated tarball smoke test
        run: npm run smoke-test

      - name: Pack release tarball and compute SHA-512
        id: pack
        run: |
          TARBALL=$(npm pack | tail -n 1)
          echo "TARBALL=$TARBALL" >> "$GITHUB_OUTPUT"
          sha512sum "$TARBALL" > "${TARBALL}.sha512"
          mkdir -p release-artifacts
          cp "$TARBALL" "${TARBALL}.sha512" release-artifacts/
          ls -la release-artifacts/

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: release-artifacts/
          retention-days: 7

  publish:
    name: publish-release
    needs: [verify-and-pack]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@simorml/kid-lesson-games
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read .nvmrc
        id: nvm
        run: echo "NODE_VERSION=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js ${{ steps.nvm.outputs.NODE_VERSION }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.nvm.outputs.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: release-artifacts

      - name: Verify tarball checksum
        env:
          TARBALL: ${{ needs.verify-and-pack.outputs.tarball }}
        run: |
          cd release-artifacts
          sha512sum --check --strict "${TARBALL}.sha512"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ needs.verify-and-pack.outputs.tarball }}
          IS_DRY_RUN: ${{ needs.verify-and-pack.outputs.is_dry_run }}
        run: |
          cd release-artifacts
          if [ "$IS_DRY_RUN" = "true" ]; then
            echo "DRY RUN MODE: Skipping npm publish."
            echo "Would publish: $TARBALL with provenance."
          else
            echo "Publishing $TARBALL to npm registry with provenance..."
            npm publish "$TARBALL" --access public --provenance
          fi

      - name: Create GitHub Release
        if: needs.verify-and-pack.outputs.is_dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify-and-pack.outputs.version }}
          TARBALL: ${{ needs.verify-and-pack.outputs.tarball }}
        run: |
          TAG="v${VERSION}"
          cd release-artifacts

          # Extract changelog section for release notes if available (VERSION read from env, regex-escaped)
          python3 -c '
          import os, re
          version = os.environ["VERSION"]
          content = open("../CHANGELOG.md", encoding="utf-8").read()
          match = re.search(r"## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=\n## \[|\Z)", content, re.DOTALL)
          notes = match.group(1).strip() if match else "Release " + version
          open("release-notes.md", "w", encoding="utf-8").write(notes)
          ' || echo "Release ${VERSION}" > release-notes.md

          gh release create "$TAG" "$TARBALL" "${TARBALL}.sha512" \
            --title "$TAG" \
            --notes-file release-notes.md
