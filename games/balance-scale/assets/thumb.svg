<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bsBgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="url(#bsBgGlow)"/>
  <!-- Central Fulcrum & Pillar -->
  <polygon points="60,54 52,90 68,90" fill="#475569" stroke="#64748b" stroke-width="1.5"/>
  <rect x="44" y="88" width="32" height="6" rx="3" fill="#334155"/>
  <circle cx="60" cy="54" r="5" fill="#f8fafc" stroke="#38bdf8" stroke-width="2"/>
  <!-- Equilibrium needle -->
  <line x1="60" y1="54" x2="60" y2="34" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  <circle cx="60" cy="32" r="2.5" fill="#fbbf24"/>
  <!-- Horizontal Balance Beam -->
  <rect x="22" y="52" width="76" height="4" rx="2" fill="url(#beamGrad)"/>
  <!-- Left Pan Suspension & Pan -->
  <line x1="28" y1="56" x2="20" y2="76" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="28" y1="56" x2="36" y2="76" stroke="#94a3b8" stroke-width="1.2"/>
  <path d="M 16 76 Q 28 84 40 76 Z" fill="#475569" stroke="#64748b" stroke-width="1.2"/>
  <!-- Left Weight (500g gold block) -->
  <rect x="23" y="66" width="10" height="10" rx="2" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
  <!-- Right Pan Suspension & Pan -->
  <line x1="92" y1="56" x2="84" y2="76" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="92" y1="56" x2="100" y2="76" stroke="#94a3b8" stroke-width="1.2"/>
  <path d="M 80 76 Q 92 84 104 76 Z" fill="#475569" stroke="#64748b" stroke-width="1.2"/>
  <!-- Right Weights (200g + 300g blocks) -->
  <rect x="83" y="68" width="8" height="8" rx="1.5" fill="#38bdf8" stroke="#0284c7" stroke-width="1"/>
  <rect x="92" y="68" width="8" height="8" rx="1.5" fill="#34d399" stroke="#059669" stroke-width="1"/>
</svg>
