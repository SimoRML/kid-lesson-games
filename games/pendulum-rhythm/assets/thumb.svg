<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <radialGradient id="bobGlow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>
    <linearGradient id="stringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="32" fill="url(#bgGlow)" />

  <!-- Metronome / Rhythm Grid Arc Lines -->
  <path d="M 48 200 A 160 160 0 0 1 208 200" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 6" opacity="0.6" />
  <path d="M 68 200 A 130 130 0 0 1 188 200" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 8" opacity="0.4" />
  <path d="M 88 200 A 100 100 0 0 1 168 200" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.3" />

  <!-- Pivot mount at top center -->
  <rect x="116" y="24" width="24" height="12" rx="4" fill="#475569" stroke="#64748b" stroke-width="2" />
  <circle cx="128" cy="30" r="5" fill="#f8fafc" />

  <!-- Ghost trail of swing -->
  <line x1="128" y1="30" x2="74" y2="150" stroke="#38bdf8" stroke-width="2" opacity="0.25" stroke-dasharray="3 3" />
  <circle cx="74" cy="150" r="16" fill="#38bdf8" opacity="0.15" />

  <line x1="128" y1="30" x2="182" y2="150" stroke="#fbbf24" stroke-width="2" opacity="0.25" stroke-dasharray="3 3" />
  <circle cx="182" cy="150" r="16" fill="#fbbf24" opacity="0.15" />

  <!-- Main active pendulum string -->
  <line x1="128" y1="30" x2="160" y2="178" stroke="url(#stringGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Active Bob with glow & shadow -->
  <circle cx="160" cy="178" r="24" fill="url(#bobGlow)" stroke="#bae6fd" stroke-width="2.5" filter="url(#shadow)" />
  <!-- Bob highlight -->
  <ellipse cx="152" cy="168" rx="7" ry="4" fill="#ffffff" opacity="0.6" transform="rotate(-20 152 168)" />

  <!-- Rhythm Wave Indicator Pulse -->
  <circle cx="160" cy="178" r="32" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.5" stroke-dasharray="4 4" />
  <circle cx="160" cy="178" r="40" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.3" stroke-dasharray="6 6" />

  <!-- Pedestal & Target block (preschool knockdown hint) -->
  <rect x="36" y="196" width="36" height="8" rx="2" fill="#334155" />
  <rect x="42" y="172" width="24" height="24" rx="4" fill="#f59e0b" stroke="#fbbf24" stroke-width="2" transform="rotate(12 54 184)" />

  <!-- Note symbol / Metronome icon overlay -->
  <circle cx="128" cy="216" r="3" fill="#10b981" />
  <circle cx="108" cy="216" r="3" fill="#38bdf8" />
  <circle cx="148" cy="216" r="3" fill="#fbbf24" />
</svg>
