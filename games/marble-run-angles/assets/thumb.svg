<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="mrBgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <radialGradient id="marbleGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
  </defs>
  <rect width="120" height="120" rx="20" fill="url(#mrBgGlow)"/>
  <!-- Top Angled Ramp -->
  <line x1="20" y1="28" x2="68" y2="44" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <line x1="20" y1="28" x2="68" y2="44" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <!-- Bouncer / 45-deg Angle Deflector Block -->
  <g transform="translate(76, 52) rotate(30)">
    <rect x="-14" y="-4" width="28" height="8" rx="3" fill="#f59e0b" stroke="#fbbf24" stroke-width="1.5"/>
  </g>
  <!-- Lower Reverse Ramp -->
  <line x1="88" y1="68" x2="40" y2="84" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <line x1="88" y1="68" x2="40" y2="84" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <!-- Trajectory dashed arc -->
  <path d="M 68 44 Q 82 48 76 56 Q 70 64 64 74" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="3,3" opacity="0.8"/>
  <!-- Target Cup at bottom -->
  <path d="M 30 88 L 34 102 Q 44 106 54 102 L 58 88 Z" fill="#10b981" stroke="#059669" stroke-width="1.5"/>
  <circle cx="44" cy="94" r="3" fill="#a7f3d0"/>
  <!-- Rolling Marble with specular gleam -->
  <circle cx="56" cy="36" r="8" fill="url(#marbleGlow)" stroke="#bae6fd" stroke-width="1.2"/>
  <ellipse cx="53" cy="33" rx="2.5" ry="1.5" fill="#ffffff" opacity="0.85" transform="rotate(-30 53 33)"/>
</svg>
