  </defs>
  <rect width="120" height="120" rx="24" fill="url(#cfBg)"/>
  <!-- conveyor belt -->
  <rect x="10" y="84" width="100" height="10" rx="5" fill="#334155"/>
  <circle cx="18" cy="89" r="3" fill="#64748b"/><circle cx="60" cy="89" r="3" fill="#64748b"/><circle cx="102" cy="89" r="3" fill="#64748b"/>
