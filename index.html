<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kid Lesson Games - Web Component Playground</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #090d16;
        color: #f1f5f9;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 20px 32px;
        background: rgba(15, 23, 42, 0.8);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
      }

      .logo {
        font-size: 1.25rem;
        font-weight: 800;
        background: linear-gradient(135deg, #38bdf8, #818cf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .header-meta {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 0.85rem;
        color: #94a3b8;
      }

      .header-badge {
        background: #1e293b;
        color: #38bdf8;
        border: 1px solid rgba(56, 189, 248, 0.25);
        padding: 4px 10px;
        border-radius: 9999px;
        font-weight: 600;
        font-size: 0.75rem;
      }

      main {
        flex: 1;
        max-width: 1200px;
        width: 100%;
        margin: 0 auto;
        padding: 32px 24px;
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 24px;
      }

      @media (max-width: 900px) {
        main {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      .game-container {
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .game-meta-card {
        background: #0f172a;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .game-meta-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .game-meta-title {
        font-size: 1.15rem;
        font-weight: 700;
        color: #f8fafc;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .category-pill {
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 3px 10px;
        border-radius: 9999px;
        background: rgba(56, 189, 248, 0.15);
        color: #38bdf8;
        border: 1px solid rgba(56, 189, 248, 0.3);
      }

      .category-pill[data-category="numbers"] {
        background: rgba(56, 189, 248, 0.15);
        color: #38bdf8;
        border-color: rgba(56, 189, 248, 0.3);
      }

      .category-pill[data-category="logic"] {
        background: rgba(168, 85, 247, 0.15);
        color: #c084fc;
        border-color: rgba(168, 85, 247, 0.3);
      }

      .category-pill[data-category="spatial"] {
        background: rgba(251, 191, 36, 0.15);
        color: #fbbf24;
        border-color: rgba(251, 191, 36, 0.3);
      }

      .game-meta-desc {
        font-size: 0.88rem;
        color: #94a3b8;
        line-height: 1.45;
      }

      .game-meta-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }

      .skill-tag {
        font-size: 0.72rem;
        background: #1e293b;
        color: #cbd5e1;
        padding: 3px 9px;
        border-radius: 6px;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .game-card {
        background: #0f172a;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        overflow: hidden;
        height: 560px;
      }

      .panel {
        background: #0f172a;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .panel-title {
        font-size: 0.95rem;
        font-weight: 700;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .control-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        gap: 12px;
      }

      .control-label {
        font-size: 0.9rem;
        color: #cbd5e1;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      select, button {
        background: #1e293b;
        color: #f8fafc;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 0.85rem;
        cursor: pointer;
        transition: border-color 0.15s ease, background 0.15s ease;
      }

      select:hover, button:hover {
        background: #253349;
        border-color: rgba(255, 255, 255, 0.2);
      }

      select:focus-visible, button:focus-visible {
        outline: 2px solid #38bdf8;
        outline-offset: 2px;
      }

      #select-game {
        font-weight: 600;
        color: #38bdf8;
        border-color: rgba(56, 189, 248, 0.35);
        background: #152238;
        max-width: 190px;
      }

      #event-log {
        flex: 1;
        background: #080c14;
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 12px;
        padding: 12px;
        font-family: monospace;
        font-size: 0.8rem;
        color: #38bdf8;
        overflow-y: auto;
        max-height: 220px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .log-entry {
        line-height: 1.4;
      }

      .log-time {
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">🚀 Kid Lesson Games</div>
      <div class="header-meta">
        <span class="header-badge">Web Component Testbed</span>
        <span>Cartridge Playground</span>
      </div>
    </header>

    <main>
      <div class="game-container">
        <!-- Live Cartridge Metadata Banner -->
        <div class="game-meta-card" id="game-meta-card">
          <div class="game-meta-top">
            <h1 class="game-meta-title" id="meta-title">Balance the Scale</h1>
            <span class="category-pill" id="meta-category" data-category="numbers">numbers</span>
          </div>
          <p class="game-meta-desc" id="meta-desc">Place weights on the scale to achieve balance using addition and lever physics!</p>
          <div class="game-meta-tags" id="meta-skills">
            <span class="skill-tag">addition</span>
            <span class="skill-tag">number-sense</span>
            <span class="skill-tag">visual-physics</span>
            <span class="skill-tag">equilibrium</span>
          </div>
        </div>

        <!-- The Web Component under test! -->
        <div class="game-card">
          <kid-game id="my-game" game="balance-scale" age="6-8" difficulty="medium" sound="true"></kid-game>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Component Controls</div>

        <div class="control-row">
          <label for="select-game" class="control-label">🎮 Active Game</label>
          <select id="select-game" aria-label="Select Game Cartridge">
            <option value="balance-scale">Balance the Scale</option>
            <option value="buoyancy-tank">Buoyancy Tank &amp; Density Lab</option>
            <option value="gear-trains">Gear Trains</option>
            <option value="marble-run-angles">Marble Run Angles</option>
            <option value="pendulum-rhythm">Pendulum Rhythm Lab</option>
            <option value="pulley-lift">Pulley Lift &amp; Mechanical Advantage</option>
          </select>
        </div>

        <div class="control-row">
          <label for="select-lang" class="control-label">Language / Langue</label>
          <select id="select-lang">
            <option value="en" selected>English (en)</option>
            <option value="fr">Français (fr)</option>
          </select>
        </div>

        <div class="control-row">
          <label for="select-age" class="control-label">Age Bracket</label>
          <select id="select-age">
            <option value="3-5">3–5 (Preschool)</option>
            <option value="6-8" selected>6–8 (Elementary)</option>
            <option value="9-11">9–11 (Upper)</option>
          </select>
        </div>

        <div class="control-row">
          <label for="select-levels" class="control-label">Levels Source</label>
          <select id="select-levels">
            <option value="auto" selected>Auto-Generate (Default)</option>
          </select>
        </div>

        <div class="control-row">
          <span class="control-label">Sound FX</span>
          <button type="button" id="btn-sound">Toggle Sound (ON)</button>
        </div>

        <div class="control-row">
          <span class="control-label">Actions</span>
          <button type="button" id="btn-restart">Restart Game</button>
        </div>

        <div class="panel-title" style="margin-top: 12px;">Live Event Bridge</div>
        <div id="event-log"></div>
      </div>
    </main>

    <script type="module">
      import { registry } from './src/index.ts';

      const game = document.getElementById('my-game');
      const log = document.getElementById('event-log');
      const selectGame = document.getElementById('select-game');
      const selectLang = document.getElementById('select-lang');
      const selectAge = document.getElementById('select-age');
      const selectLevels = document.getElementById('select-levels');
      const btnSound = document.getElementById('btn-sound');
      const btnRestart = document.getElementById('btn-restart');

      const metaTitle = document.getElementById('meta-title');
      const metaCategory = document.getElementById('meta-category');
      const metaDesc = document.getElementById('meta-desc');
      const metaSkills = document.getElementById('meta-skills');

      const customPresetsByGame = {
        'balance-scale': {
          'auto': { label: 'Auto-Generate (Default)', value: null },
          'custom-addition': {
            label: 'Custom: 1000g Addition',
            value: [
              {
                left: [1000],
                inventory: [500, 250, 250, 100],
                instruction: 'Custom Level 1: Decompose 1 kg (1000g) into metric parts!'
              },
              {
                left: [750],
                inventory: [500, 200, 50, 100],
                instruction: 'Custom Level 2: Balance 750g!'
              }
            ]
          },
          'custom-lever': {
            label: 'Custom: Mechanical Lever',
            value: [
              {
                left: [300],
                leftNotch: 4,
                rightNotch: 2,
                inventory: [600, 200, 100],
                leverMode: true,
                instruction: 'Custom Lever: 300g at Notch 4 (torque 1200). Balance at Notch 2 with 600g!'
              }
            ]
          }
        },
        'marble-run-angles': {
          'auto': { label: 'Auto-Generate (Default)', value: null },
          'custom-ricochet': {
            label: 'Custom: Chasm Trampoline Reflection',
            value: [
              {
                id: 'custom-chasm-1',
                title: 'Custom Chasm Bounce',
                mode: 'reflection',
                emitter: { x: 140, y: 50, vx: 0, vy: 40 },
                cup: { x: 600, y: 350, width: 80, height: 44 },
                fixedRamps: [
                  { x1: 360, y1: 320, x2: 570, y2: 340, type: 'wood', restitution: 0.5 }
                ],
                obstacles: [{ x: 280, y: 440, radius: 24 }],
                slots: [
                  {
                    id: 'slot-1',
                    x: 140,
                    y: 190,
                    allowedTypes: ['wood', 'trampoline'],
                    initialAngle: 45
                  }
                ],
                inventory: [
                  { type: 'trampoline', angleDeg: 45, length: 120, restitution: 0.9 },
                  { type: 'wood', angleDeg: 45, length: 120, restitution: 0.5 }
                ],
                stars: [{ x: 260, y: 230 }, { x: 460, y: 310 }],
                instruction: 'Custom: Snap the bouncy trampoline into the slot to launch across the chasm!'
              }
            ]
          }
        },
        'pulley-lift': {
          'auto': { label: 'Auto-Generate (Default)', value: null },
          'custom-compound': {
            label: 'Custom: 4x Heavy Lift (240kg)',
            value: [
              {
                id: 'custom-pulley-4x',
                title: 'Compound 4x Hoist',
                loadKg: 240,
                targetHeightM: 2.0,
                systemType: 'compound-4',
                availableWeights: [40, 20, 30, 50],
                instruction: 'Custom: 4-pulley compound tackle (MA = 4)! Combine 40 kg + 20 kg = 60 kg to lift 240 kg.'
              }
            ]
          }
        },
        'gear-trains': {
          'auto': { label: 'Auto-Generate (Default)', value: null },
          'custom-ratio': {
            label: 'Custom: 3x Speed Tripler',
            value: [
              {
                id: 'custom-gear-3x',
                title: '3:1 Speed Tripler',
                ageGroup: '9-11',
                motor: { pegId: 'motor', x: 160, y: 230, teeth: 24, rpm: 40, direction: 'cw' },
                target: { pegId: 'target', x: 480, y: 230, teeth: 8, targetRpm: 120, targetDirection: 'cw', type: 'dial' },
                pegs: [{ id: 'p1', x: 360, y: 230 }],
                inventory: [{ teeth: 16 }, { teeth: 12 }, { teeth: 6 }],
                instruction: 'Custom: Bridge the 24T motor and 8T target with a 16T gear to triple output to 120 RPM CW!'
              }
            ]
          }
        },
        'buoyancy-tank': {
          'auto': { label: 'Auto-Generate (Default)', value: null },
          'custom-displacement': {
            label: 'Custom: +300 mL Displacement',
            value: [
              {
                id: 'custom-bt-disp',
                title: 'Graduated Cylinder +300 mL',
                ageGroup: '6-8',
                fluidType: 'freshwater',
                initialWaterMl: 400,
                targetWaterMl: 700,
                tankCapacityMl: 1000,
                inventory: [
                  { id: 'b1', name: 'Block 100', label: '100 cm³', volumeCm3: 100, massG: 250 },
                  { id: 'b2', name: 'Block 200', label: '200 cm³', volumeCm3: 200, massG: 500 },
                  { id: 'b3', name: 'Distractor 150', label: '150 cm³', volumeCm3: 150, massG: 375, isDistractor: true }
                ]
              }
            ]
          },
          'custom-sub': {
            label: 'Custom: Saltwater Submarine Trim',
            value: [
              {
                id: 'custom-bt-sub',
                title: 'Saltwater Brine Trim (1.20 g/cm³)',
                ageGroup: '9-11',
                fluidType: 'saltwater',
                initialWaterMl: 600,
                targetWaterMl: 600,
                tankCapacityMl: 1000,
                submarine: { massG: 360, volumeCm3: 400, slots: 2 },
                modules: [
                  { id: 'm1', name: 'Ballast +70g', label: '+70 g', massG: 70, volumeCm3: 0 },
                  { id: 'm2', name: 'Ballast +50g', label: '+50 g', massG: 50, volumeCm3: 0 },
                  { id: 'm3', name: 'Ballast +30g', label: '+30 g', massG: 30, volumeCm3: 0, isDistractor: true }
                ]
              }
            ]
          }
        },
        'pendulum-rhythm': {
          'auto': { label: 'Auto-Generate (Default)', value: null },
          'custom-metronome': {
            label: 'Custom: Match 75 BPM Metronome',
            value: [
              {
                id: 'custom-metronome-1',
                ageGroup: '6-8',
                mode: 'metronome',
                title: 'Custom Tempo Sync',
                prompt: 'Match 75 BPM with the 64cm string length!',
                pendulums: [
                  {
                    id: 'p1',
                    pivotX: 300,
                    pivotY: 55,
                    length: 100,
                    mass: 100,
                    isAdjustableLength: true,
                    allowedLengths: [25, 45, 64, 100],
                    allowedMasses: [50, 100, 200]
                  }
                ],
                availableLengths: [25, 45, 64, 100],
                availableMasses: [50, 100, 200],
                metronome: {
                  bpm: 75,
                  targetStreak: 3
                }
              }
            ]
          },
          'custom-polyrhythm': {
            label: 'Custom: 2:1 Harmonic Polyrhythm',
            value: [
              {
                id: 'custom-poly-1',
                ageGroup: '9-11',
                mode: 'polyrhythm',
                title: 'Custom 2:1 Polyrhythm',
                prompt: 'Set Pendulum B to 100cm so length ratio is (2/1)² = 4!',
                pendulums: [
                  { id: 'pendulum-a', pivotX: 220, pivotY: 55, length: 25, mass: 100, isAdjustableLength: false },
                  {
                    id: 'pendulum-b',
                    pivotX: 380,
                    pivotY: 55,
                    length: 50,
                    mass: 100,
                    isAdjustableLength: true,
                    allowedLengths: [25, 50, 75, 100]
                  }
                ],
                availableLengths: [25, 50, 75, 100],
                polyrhythm: {
                  ratioP: 2,
                  ratioQ: 1,
                  targetCoincidences: 2
                }
              }
            ]
          }
        }
      };

      function appendLog(type, detail) {
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        const now = new Date().toLocaleTimeString();
        entry.innerHTML = `<span class="log-time">[${now}]</span> <strong>${type}</strong> ${JSON.stringify(detail)}`;
        log.appendChild(entry);
        log.scrollTop = log.scrollHeight;
      }

      function updateMetaDisplay(gameId) {
        const meta = registry.get(gameId)?.metadata;
        if (!meta) return;

        if (metaTitle) metaTitle.textContent = meta.title || gameId;
        if (metaDesc) metaDesc.textContent = meta.description || 'Interactive educational physics cartridge.';
        if (metaCategory) {
          metaCategory.textContent = meta.category || 'cartridge';
          metaCategory.setAttribute('data-category', meta.category || 'numbers');
        }
        if (metaSkills) {
          metaSkills.innerHTML = (meta.skills || [])
            .map((s) => `<span class="skill-tag">${s}</span>`)
            .join('');
        }
      }

      function updateLevelsDropdown(gameId) {
        const presets = customPresetsByGame[gameId] || {
          'auto': { label: 'Auto-Generate (Default)', value: null }
        };
        selectLevels.innerHTML = '';
        for (const [key, item] of Object.entries(presets)) {
          const opt = document.createElement('option');
          opt.value = key;
          opt.textContent = item.label;
          selectLevels.appendChild(opt);
        }
        selectLevels.value = 'auto';
        game.removeAttribute('levels');
        game.levels = null;
      }

      function populateGameSelector() {
        const games = registry.list();
        if (games && games.length > 0) {
          selectGame.innerHTML = '';
          const sorted = [...games].sort((a, b) => a.title.localeCompare(b.title));
          for (const g of sorted) {
            const opt = document.createElement('option');
            opt.value = g.id;
            opt.textContent = `${g.title} (${g.id})`;
            selectGame.appendChild(opt);
          }
        }
      }

      function switchGame(newGameId) {
        if (!newGameId) return;

        const prevId = game.getAttribute('game');
        if (prevId === newGameId) return;

        // Update URL query parameter
        const url = new URL(window.location.href);
        url.searchParams.set('game', newGameId);
        window.history.replaceState(null, '', url.toString());

        // Update select value if not already in sync
        if (selectGame.value !== newGameId) {
          selectGame.value = newGameId;
        }

        // Reset and update levels dropdown for new cartridge
        updateLevelsDropdown(newGameId);

        // Update active game on element
        game.setAttribute('game', newGameId);
        updateMetaDisplay(newGameId);

        appendLog('game:switch', { from: prevId, to: newGameId });
      }

      // Initialize
      populateGameSelector();

      const urlParams = new URLSearchParams(window.location.search);
      const urlGame = urlParams.get('game');
      const initialGameId = (urlGame && registry.has(urlGame))
        ? urlGame
        : (game.getAttribute('game') || 'balance-scale');

      selectGame.value = initialGameId;
      if (game.getAttribute('game') !== initialGameId) {
        game.setAttribute('game', initialGameId);
      }
      updateLevelsDropdown(initialGameId);
      updateMetaDisplay(initialGameId);

      // Event listeners
      selectGame.addEventListener('change', (e) => switchGame(e.target.value));

      selectLevels.addEventListener('change', (e) => {
        const val = e.target.value;
        const currentGameId = game.getAttribute('game') || 'balance-scale';
        const presets = customPresetsByGame[currentGameId] || {};
        const config = presets[val]?.value;
        if (config) {
          game.levels = config;
          appendLog('custom-levels-set', { preset: val, levelsCount: config.length });
        } else {
          game.removeAttribute('levels');
          game.levels = null;
          appendLog('custom-levels-cleared', { fallback: 'auto' });
        }
      });

      ['game:ready', 'game:start', 'game:progress', 'game:score', 'game:complete'].forEach((evtName) => {
        game.addEventListener(evtName, (e) => {
          appendLog(evtName, e.detail);
          if (evtName === 'game:ready' && e.detail?.gameId) {
            updateMetaDisplay(e.detail.gameId);
          }
        });
      });

      selectLang.addEventListener('change', (e) => {
        game.setAttribute('locale', e.target.value);
        appendLog('config-changed', { locale: e.target.value });
      });

      selectAge.addEventListener('change', (e) => {
        game.setAttribute('age', e.target.value);
        appendLog('config-changed', { age: e.target.value });
      });

      let soundOn = true;
      btnSound.addEventListener('click', () => {
        soundOn = !soundOn;
        game.setAttribute('sound', soundOn ? 'true' : 'false');
        btnSound.textContent = `Toggle Sound (${soundOn ? 'ON' : 'OFF'})`;
        appendLog('config-changed', { sound: soundOn });
      });

      btnRestart.addEventListener('click', () => {
        game.restart();
        appendLog('restart', {});
      });
    </script>
  </body>
</html>
